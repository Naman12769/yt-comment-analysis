stages:
  data_ingestion:
    cmd: python src/data/data-ingestion.py
    deps:
    - src/data/data-ingestion.py
    params:
    - data_ingestion.test_size
    outs:
    - data/raw

  data_preprocessing:
    cmd: python src/data/data-preprocessing.py
    deps:
    - data/raw/train.csv
    - data/raw/test.csv
    - src/data/data-preprocessing.py
    outs:
    - data/interim

  model_building:
    cmd: python src/model/model-building.py
    deps:
    - data/interim/train_processed.csv
    - src/model/model-building.py
    params:
    - model_building.max_features
    - model_building.ngram_range
    - model_building.learning_rate
    - model_building.max_depth
    - model_building.n_estimators
    outs:
    - lgbm_model.pkl
    - tfidf_vectorizer.pkl

  model_evaluation:
    cmd: python src/model/model-evaluation.py
    deps:
    - lgbm_model.pkl
    - tfidf_vectorizer.pkl
    - data/interim/train_processed.csv
    - data/interim/test_processed.csv
    - src/model/model-evaluation.py
    outs:
    - experiment_info.json

  model_registration:
    cmd: python src/model/register-model.py
    deps:
    - experiment_info.json
    - src/model/register-model.py